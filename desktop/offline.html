<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gloma CRM</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0a0f1d; color: #e5e7eb; font-family: 'Segoe UI', Arial, sans-serif; }
    .card { text-align: center; max-width: 380px; padding: 32px; }
    h1 { font-size: 20px; margin: 0 0 8px; color: #d4af37; }
    p { color: #9ca3af; line-height: 1.5; }
    button { margin-top: 12px; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer;
             background: #d4af37; color: #0a0f1d; font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Can't reach Gloma CRM</h1>
    <p>Check your internet connection and try again. If the problem continues, tell the Developer.</p>
    <button onclick="location.href = 'app://retry'">Try again</button>
  </div>
</body>
</html>
